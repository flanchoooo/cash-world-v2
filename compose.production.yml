# Serve port 8088 behind an HTTPS reverse proxy on the configured ADMIN_ORIGIN.
# Requires a pre-provisioned MySQL database and separate migration/runtime users.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:?Set DB_URL}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      FLYWAY_USER: ${FLYWAY_USER:?Set FLYWAY_USER}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:?Set FLYWAY_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:?Set the exact HTTPS origin}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      REMITTANCE_RATES: ${REMITTANCE_RATES:-}
  admin:
    build: ./admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8088}:8080"
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
