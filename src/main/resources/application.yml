spring:
  profiles:
    default: dev
  application:
    name: poscloud-wallet
  datasource:
    url: ${DB_URL:jdbc:mysql://54.36.182.209:3306/cash_world_v2?connectionTimeZone=UTC}
    username: ${DB_USER:developer}
    password: ${DB_PASSWORD:ch@ng3itDev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        type.preferred_uuid_jdbc_type: CHAR
        jdbc.time_zone: UTC
  flyway:
    enabled: false
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${SERVER_PORT:8011}
  error:
    include-message: never
  shutdown: graceful
wallet:
  jwt-secret: ${JWT_SECRET}
  issuer: poscloud-wallet
  mock-provider-enabled: false
springdoc:
  api-docs.enabled: false
  swagger-ui.enabled: false
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never
