services:
  mysql:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: wallet
      MYSQL_USER: wallet
      MYSQL_PASSWORD: ${DB_PASSWORD:-wallet-dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-dev-only}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - wallet-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: dev
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:8089}
      DB_URL: jdbc:mysql://mysql:3306/wallet?connectionTimeZone=UTC
      DB_USER: wallet
      DB_PASSWORD: ${DB_PASSWORD:-wallet-dev}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-admin-change-me}
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-at-least-32-bytes-change-me}
      REMITTANCE_RATES: ${REMITTANCE_RATES:-USD:BWP=13.500000}
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:8088"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
  admin:
    build: ./admin
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8089}:8080"
    depends_on:
      - app
    restart: unless-stopped
volumes:
  wallet-db:
