services:
  backend:
    build: .
    environment:
      ADMIN_ORIGIN: http://54.36.182.209:8089
    ports:
      - "${APP_PORT:-8011}:8011"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8011/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  frontend:
    build: ./admin
    ports:
      - "${ADMIN_PORT:-8089}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
